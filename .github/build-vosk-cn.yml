name: Build iGO Offline Voice Vosk CN

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-vosk-cn.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Vosk Chinese model
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          wget -O /tmp/vosk-cn.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q /tmp/vosk-cn.zip -d app/src/main/assets
          test -f app/src/main/assets/vosk-model-small-cn-0.22/am/final.mdl
          test -f app/src/main/assets/vosk-model-small-cn-0.22/conf/model.conf
          du -sh app/src/main/assets/vosk-model-small-cn-0.22

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify Chinese model inside APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'vosk-model-small-cn-0.22/am/final.mdl'
          unzip -l "$APK" | grep 'vosk-model-small-cn-0.22/conf/model.conf'
          ls -lh "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk iGO_Offline_Voice_Vosk_CN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iGO_Offline_Voice_Vosk_CN_APK
          path: iGO_Offline_Voice_Vosk_CN.apk
